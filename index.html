<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>シフト閲覧システム</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <style>
    body { font-family: sans-serif; padding: 20px; line-height: 1.6; background: #f8f9fa; }
    .box { background: white; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #e9ecef; }
    .success { color: green; font-weight: bold; }
    .error { color: red; font-weight: bold; }
    pre { background: #f1f3f5; padding: 10px; border-radius: 5px; overflow-x: auto; font-size: 12px; }
  </style>
</head>
<body>
  <h2>📅 シフト閲覧システム</h2>
  
  <div class="box" id="status">認証処理中...</div>

  <div class="box" id="profile-box" style="display:none;">
    <strong>👤 ログインユーザー:</strong> <span id="user-name"></span>
  </div>

  <div class="box" id="shift-box" style="display:none;">
    <strong>📊 取得したシフトデータ:</strong>
    <pre id="shift-data">読み込み中...</pre>
  </div>

  <script>
    // 💡 あなたのGASのウェブアプリURLをここに貼り付けます
    const GAS_URL = "<ここにGASのウェブアプリURLを貼る>";
    const LIFF_ID = "2010578436-C5btR2HU";

    function setStatus(msg) {
      document.getElementById('status').innerHTML = msg;
    }

    window.onload = function() {
      liff.init({ liffId: LIFF_ID })
        .then(() => {
          if (!liff.isLoggedIn()) {
            liff.login();
            return;
          }
          return liff.getProfile();
        })
        .then(profile => {
          if (profile) {
            setStatus("<span class='success'>✅ LIFF認証完了</span>");
            document.getElementById('profile-box').style.display = 'block';
            document.getElementById('user-name').innerText = `${profile.displayName} 様`;

            // GASからシフトデータを取得
            fetchShiftData(profile.userId, profile.displayName);
          }
        })
        .catch(err => {
          setStatus(`<span class='error'>❌ エラー発生: ${err}</span>`);
        });
    };

    function fetchShiftData(userId, displayName) {
      document.getElementById('shift-box').style.display = 'block';
      
      // API呼び出し用URLを作成
      const requestUrl = `${GAS_URL}?userId=${encodeURIComponent(userId)}&displayName=${encodeURIComponent(displayName)}`;

      fetch(requestUrl)
        .then(response => response.json())
        .then(data => {
          document.getElementById('shift-data').innerText = JSON.stringify(data, null, 2);
        })
        .catch(err => {
          document.getElementById('shift-data').innerText = "GASからのデータ取得に失敗しました: " + err;
        });
    }
  </script>
</body>
</html>
